name: Deploy site and collect analytics

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Collect anonymous analytics
        run: node scripts/collect-analytics.mjs

      - name: Persist analytics
        run: |
          git config user.name "barcode-studio-bot"
          git config user.email "barcode-studio-bot@users.noreply.github.com"
          git add analytics-store.json public/analytics.json
          if ! git diff --cached --quiet; then
            git commit -m "Update analytics [skip ci]"
            git push
          fi

      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
